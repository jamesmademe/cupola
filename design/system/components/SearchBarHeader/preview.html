<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SearchBarHeader — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round|Material+Icons+Outlined">
</head>
<body>
<div class="cp-search-bar-header-stage">
  <div class="cp-search-bar-header-row">
    <div class="cp-search-bar-header-frame"><div class="cp-search-bar-header" role="search" aria-label="Search" aria-description="Type Search movies &amp; TV shows...">
      <div class="cp-search-bar-header-bar"><span class="cp-search-bar-header-lead"><span class="cp-icon" data-ontint="seerr" data-surface="surface-container" data-alpha="0" aria-hidden="true">search</span></span><span class="cp-search-bar-header-input is-hint">Search movies &amp; TV shows...</span></div>
    </div></div>
    <span class="cp-caption">Seerr Discover · empty, hint only</span>
  </div>
  <div class="cp-search-bar-header-row">
    <div class="cp-search-bar-header-frame"><div class="cp-search-bar-header" role="search" aria-label="Search">
      <div class="cp-search-bar-header-bar"><span class="cp-search-bar-header-lead"><span class="cp-icon" data-ontint="nav-search" data-surface="surface-container" data-alpha="0" aria-hidden="true">search</span></span><span class="cp-search-bar-header-input">dune</span><span class="cp-search-bar-header-clear" role="button" aria-label="Clear search" aria-description="Remove the current search query"><span class="cp-icon" aria-hidden="true">close</span></span></div>
    </div></div>
    <span class="cp-caption">Search tab · with a query, the clear button appears</span>
  </div>
  <div class="cp-search-bar-header-row">
    <div class="cp-search-bar-header-frame"><div class="cp-search-bar-header" role="search" aria-label="Search">
      <div class="cp-search-bar-header-bar"><span class="cp-search-bar-header-lead"><span class="cp-icon" data-ontint="qbittorrent" data-surface="surface-container" data-alpha="0" aria-hidden="true">search</span></span><span class="cp-search-bar-header-input is-hint">Search torrents...</span></div>
    </div></div>
    <span class="cp-caption">qBittorrent · the magnifier carries the page's accent, walked for the field</span>
  </div>
</div>
<script>window.Cupola && window.Cupola.refresh();</script>
</body>
</html>
