<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cupola</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--on-surface); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--primary); }
  .pale { fill:var(--primary-lighter); }
  .deep { fill:var(--plate-surface); }
  .pane { fill:var(--primary-light); rx:var(--radius-sm); }
  .pane.lit { fill:var(--radarr); }
  .blk { rx:var(--radius-md); }
  .window { fill:var(--plate-well); stroke:var(--primary-lighter); stroke-width:6px; }
  .words { position:absolute; left:var(--space-xxl); bottom:var(--space-xxl); max-width:440px; }
  .name { margin:0; font-size:112px; line-height:.92; font-weight:800; letter-spacing:-.022em; font-variation-settings:'opsz' 32; color:var(--on-surface); }
  .tag { margin:var(--space-sm) 0 0 4px; font-size:14px; line-height:20px; color:var(--on-surface-variant); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      primary 128×204 bled off the top (the brand indigo, largest light) · primary-lighter 128×56 (the relief tint) · plate-surface 352×232 bleeding off the right (the dark room) — ≈40% of 960×288
  arrangement one tall indigo slab with a pale satellite beside a wide dark room panel, bottoms on one line space-xl above the edge, space-lg gutters
  pattern     the literal motif: the cupola from above — six radius-sm panes on the hexagon around a round window, primary-light, one pane lit radarr ("the service being operated supplies the light")
  scales      sides in space-lg multiples; gutters space-lg; corners radius-md; panes 40×56 at radius-sm; window stroke 6
-->
<rect class="brand blk" x="0" y="-12" width="128" height="204" rx="12"/>
<rect class="pale blk" x="0" y="208" width="128" height="56" rx="12"/>
<rect class="deep blk" x="144" y="32" width="352" height="232" rx="12"/>
<g>
<rect class="pane" x="280" y="44" width="40" height="56" rx="8" transform="rotate(30 300 148)"/>
<rect class="pane" x="280" y="44" width="40" height="56" rx="8" transform="rotate(90 300 148)"/>
<rect class="pane lit" x="280" y="44" width="40" height="56" rx="8" transform="rotate(150 300 148)"/>
<rect class="pane" x="280" y="44" width="40" height="56" rx="8" transform="rotate(210 300 148)"/>
<rect class="pane" x="280" y="44" width="40" height="56" rx="8" transform="rotate(270 300 148)"/>
<rect class="pane" x="280" y="44" width="40" height="56" rx="8" transform="rotate(330 300 148)"/>
<circle class="window" cx="300" cy="148" r="34"/>
</g>
</svg>
</div>
<div class="words">
<h1 class="name">Cupola</h1>
<p class="tag">A dark, backlit control room for the whole self-hosted media stack.</p>
</div>
</div>
</body>
</html>
