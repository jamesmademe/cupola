<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TextField — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round|Material+Icons+Outlined">
</head>
<body>
<div class="cp-stage" style="align-items:flex-start">
  <div class="cp-field"><span class="cp-caption">Rest</span><input class="cp-input" placeholder="Base URL"></div>
  <div class="cp-field"><span class="cp-caption">Focused</span><input class="cp-input is-focus" value="https://truenas.lan"></div>
  <div class="cp-field"><span class="cp-caption">Error</span><input class="cp-input is-error" value="radarr.lan:7878"><span class="cp-helper" style="color:var(--error)">Include http:// or https://</span></div>
</div>
<script>window.Cupola && window.Cupola.refresh();</script>
</body>
</html>
