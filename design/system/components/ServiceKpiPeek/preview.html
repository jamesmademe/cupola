<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ServiceKpiPeek — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round|Material+Icons+Outlined">
</head>
<body>
<div class="cp-kpi-rail">
  <div class="cp-kpi"><div class="cp-kpi__value"><span class="cp-icon" data-ontint="radarr" data-surface="surface-container" aria-hidden="true">movie</span>1,284</div><div class="cp-kpi__label">Movies</div></div>
  <div class="cp-kpi"><div class="cp-kpi__value"><span class="cp-icon" style="color:var(--on-surface-variant)" aria-hidden="true">search</span>37</div><div class="cp-kpi__label">Missing</div></div>
  <div class="cp-kpi"><div class="cp-kpi__value"><span class="cp-icon" data-ontint="info" data-surface="surface-container" aria-hidden="true">downloading</span>3</div><div class="cp-kpi__label">Queue</div></div>
  <div class="cp-kpi is-unavailable"><div class="cp-kpi__value"><span class="cp-icon" style="color:var(--on-surface-variant)" aria-hidden="true">remove</span>—</div><div class="cp-kpi__label">Not answering</div></div>
</div>
<div class="cp-kpi-rail" aria-busy="true">
  <div class="cp-kpi cp-service-kpi-peek-skeleton"><div class="cp-skeleton-block cp-skeleton-text" style="width:44px;height:16px"></div><div class="cp-skeleton-block cp-skeleton-text" style="width:64px;height:9px;margin-top:6px"></div></div>
  <div class="cp-kpi cp-service-kpi-peek-skeleton"><div class="cp-skeleton-block cp-skeleton-text" style="width:44px;height:16px"></div><div class="cp-skeleton-block cp-skeleton-text" style="width:64px;height:9px;margin-top:6px"></div></div>
  <div class="cp-kpi cp-service-kpi-peek-skeleton"><div class="cp-skeleton-block cp-skeleton-text" style="width:44px;height:16px"></div><div class="cp-skeleton-block cp-skeleton-text" style="width:64px;height:9px;margin-top:6px"></div></div>
</div>
<div class="cp-kpi-rail">
  <div class="cp-kpi is-unavailable"><div class="cp-kpi__value"><span class="cp-icon" style="color:var(--on-surface-variant)" aria-hidden="true">remove</span>—</div><div class="cp-kpi__label">Not answering</div></div>
</div>
<script>window.Cupola && window.Cupola.refresh();</script>
</body>
</html>
