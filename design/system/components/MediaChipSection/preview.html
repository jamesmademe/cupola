<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MediaChipSection — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round|Material+Icons+Outlined">
</head>
<body>
<div class="cp-col" style="padding:var(--space-lg);gap:var(--space-sm)">
  <div class="cp-caption">.neutral — genres and TMDB keywords</div>
  <div class="cp-media-chip-section-wrap">
    <span class="cp-genre">Science Fiction</span><span class="cp-genre">Adventure</span><span class="cp-genre">Drama</span><span class="cp-genre">Action</span>
  </div>
  <div class="cp-caption" style="margin-top:var(--space-md)">.accented — real Radarr tags only, the accent walked for its 12% tint</div>
  <div class="cp-media-chip-section-wrap">
    <span class="cp-tag cp-media-chip-section-tag" data-ontint="radarr" data-surface="surface" data-alpha="0.12" data-alpha-light="0.12">4k</span><span class="cp-tag cp-media-chip-section-tag" data-ontint="radarr" data-surface="surface" data-alpha="0.12" data-alpha-light="0.12">family</span><span class="cp-tag cp-media-chip-section-tag" data-ontint="radarr" data-surface="surface" data-alpha="0.12" data-alpha-light="0.12">watchlist</span>
  </div>
  <div class="cp-caption" style="margin-top:var(--space-md)">.accented on Sonarr</div>
  <div class="cp-media-chip-section-wrap">
    <span class="cp-tag cp-media-chip-section-tag" data-ontint="sonarr" data-surface="surface" data-alpha="0.12" data-alpha-light="0.12">anime</span><span class="cp-tag cp-media-chip-section-tag" data-ontint="sonarr" data-surface="surface" data-alpha="0.12" data-alpha-light="0.12">hdr</span>
  </div>
</div>
<script>window.Cupola && window.Cupola.refresh();</script>
</body>
</html>
