<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ContentCard — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round|Material+Icons+Outlined">
</head>
<body>
<div class="cp-stage" style="align-items:flex-start;gap:var(--space-xl)">
  <div class="cp-col" style="gap:var(--space-sm)">
    <div class="cp-content-card-card is-fixed"><img class="cp-content-card-img" src="__POSTER__" alt=""><div class="cp-content-card-corner"><span class="cp-badge cp-badge--compact" style="background:color-mix(in srgb, var(--warning) 90%, transparent);border-color:var(--warning)" data-on="warning"><span class="cp-icon" aria-hidden="true">sync_problem</span><span class="cp-tabular">43%</span></span></div></div>
    <div class="cp-caption">Image + badge</div>
  </div>
  <div class="cp-col" style="gap:var(--space-sm)">
    <div class="cp-content-card-card is-fixed"><img class="cp-content-card-img" src="__POSTER__" alt=""></div>
    <div class="cp-caption">Image, no badge</div>
  </div>
  <div class="cp-col" style="gap:var(--space-sm)">
    <div class="cp-content-card-card is-fixed"><div class="cp-content-card-shimmer"></div></div>
    <div class="cp-caption">Loading (shimmer frame)</div>
  </div>
  <div class="cp-col" style="gap:var(--space-sm)">
    <div class="cp-content-card-card is-fixed"><div class="cp-content-card-empty"><span class="cp-icon outlined" aria-hidden="true">movie</span></div></div>
    <div class="cp-caption">No URL</div>
  </div>
  <div class="cp-col" style="gap:var(--space-sm)">
    <div class="cp-content-card-card is-fixed"><div class="cp-content-card-empty is-error"><span class="cp-icon outlined" aria-hidden="true">broken_image</span></div></div>
    <div class="cp-caption">Load failed</div>
  </div>
</div>
<script>window.Cupola && window.Cupola.refresh();</script>
</body>
</html>
