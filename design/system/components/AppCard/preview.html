<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AppCard — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round|Material+Icons+Outlined">
</head>
<body>
<div class="cp-stage" style="align-items:stretch">
  <div class="cp-card" style="width:168px"><div class="cp-title-small">Filled</div><div class="cp-body-small" style="color:var(--on-surface-variant)">Default flat panel</div></div>
  <div class="cp-card cp-card--outlined" style="width:168px"><div class="cp-title-small">Outlined</div><div class="cp-body-small" style="color:var(--on-surface-variant)">Transparent, outline</div></div>
  <div class="cp-card cp-card--surface-outlined" style="width:168px"><div class="cp-title-small">Surface outlined</div><div class="cp-body-small" style="color:var(--on-surface-variant)">Panel + outline-variant</div></div>
  <div class="cp-card cp-card--elevated" style="width:168px"><div class="cp-title-small">Elevated</div><div class="cp-body-small" style="color:var(--on-surface-variant)">Panel + level-2</div></div>
  <div class="cp-card cp-card--elevated cp-card--glow" style="width:168px;--accent:var(--truenas)"><div class="cp-title-small">Signature</div><div class="cp-body-small" style="color:var(--on-surface-variant)">One service glow</div></div>
</div>
<script>window.Cupola && window.Cupola.refresh();</script>
</body>
</html>
