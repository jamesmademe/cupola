<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round|Material+Icons+Outlined">
</head>
<body>
<div class="cp-stage">
  <button class="cp-btn cp-btn--filled"><span class="cp-icon " aria-hidden="true">download</span>Grab</button>
  <button class="cp-btn cp-btn--outlined">Interactive search</button>
  <button class="cp-btn cp-btn--text">Open in qBittorrent</button>
</div>
<div class="cp-stage" style="padding-top:0">
  <button class="cp-btn cp-btn--filled" aria-description="requires a read-write key"><span class="cp-button-dim"><span class="cp-icon" aria-hidden="true">play_arrow</span>Start</span></button>
  <button class="cp-btn cp-btn--outlined" aria-description="requires a read-write key"><span class="cp-button-dim">Update</span></button>
  <button class="cp-btn cp-btn--text" aria-description="requires qBittorrent"><span class="cp-button-dim">Open in qBittorrent</span></button>
  <span class="cp-caption">Gated · label and glyph at 38%, container and target kept</span>
</div>
<script>window.Cupola && window.Cupola.refresh();</script>
</body>
</html>
