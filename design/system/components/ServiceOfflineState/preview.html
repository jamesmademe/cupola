<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ServiceOfflineState — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round|Material+Icons+Outlined">
</head>
<body>
<div class="cp-service-offline-state-stage">
  <div class="cp-col" style="align-items:center;gap:0">
    <div class="cp-service-offline-state" role="group" aria-label="SABnzbd did not answer. No response for 40 minutes. Anything it holds is missing from this page.">
      <span class="cp-icon" data-ontint="sabnzbd" data-surface="surface" data-alpha="0" aria-hidden="true">cloud_off</span>
      <h3 class="cp-service-offline-state__title" aria-hidden="true">SABnzbd did not answer</h3>
      <p class="cp-service-offline-state__body" aria-hidden="true">No response for 40 minutes. Anything it holds is missing from this page.</p>
      <div class="cp-service-offline-state__actions"><button class="cp-btn cp-btn--filled"><span class="cp-icon" aria-hidden="true">refresh</span>Retry</button><button class="cp-service-offline-state__text">Settings</button></div>
    </div>
    <span class="cp-caption">With since and onOpenSettings</span>
  </div>
  <div class="cp-col" style="align-items:center;gap:0">
    <div class="cp-service-offline-state" role="group" aria-label="Transmission did not answer. No response. Anything it holds is missing from this page.">
      <span class="cp-icon" data-ontint="transmission" data-surface="surface" data-alpha="0" aria-hidden="true">cloud_off</span>
      <h3 class="cp-service-offline-state__title" aria-hidden="true">Transmission did not answer</h3>
      <p class="cp-service-offline-state__body" aria-hidden="true">No response. Anything it holds is missing from this page.</p>
      <div class="cp-service-offline-state__actions"><button class="cp-btn cp-btn--filled"><span class="cp-icon" aria-hidden="true">refresh</span>Retry</button></div>
    </div>
    <span class="cp-caption">No span known · Retry only</span>
  </div>
</div>
<script>window.Cupola && window.Cupola.refresh();</script>
</body>
</html>
