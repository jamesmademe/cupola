<!-- @dsCard group="Status" height=210 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StatusBadge — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round|Material+Icons+Outlined">
</head>
<body>
<div class="cp-stage">
  <span class="cp-badge"><span class="cp-icon" data-ontint="success" aria-hidden="true">check_circle</span>Available</span>
  <span class="cp-badge"><span class="cp-ring" data-ontint="info"></span>Downloading<span class="cp-tabular">42%</span></span>
  <span class="cp-badge"><span class="cp-icon" data-ontint="info" aria-hidden="true">schedule</span>Queued</span>
  <span class="cp-badge"><span class="cp-icon" data-ontint="info" aria-hidden="true">hourglass_bottom</span>Import pending</span>
  <span class="cp-badge"><span class="cp-icon" data-ontint="warning" aria-hidden="true">sync_problem</span>Stalled</span>
  <span class="cp-badge"><span class="cp-icon" data-ontint="warning" aria-hidden="true">block</span>Import blocked</span>
  <span class="cp-badge"><span class="cp-icon" data-ontint="error" aria-hidden="true">cloud_off</span>Client unavailable</span>
  <span class="cp-badge"><span class="cp-icon" data-ontint="primary" aria-hidden="true">add_circle</span>Not requested</span>
  <span class="cp-badge"><span class="cp-icon" style="color:var(--on-surface-variant)" aria-hidden="true">cancel</span>Missing</span>
  <span class="cp-badge"><span class="cp-icon" style="color:var(--on-surface-variant)" aria-hidden="true">upgrade</span>Upgrade available</span>
  <span class="cp-badge"><span class="cp-icon" style="color:var(--on-surface-variant)" aria-hidden="true">pause_circle</span>Paused</span>
  <div class="cp-plate"><span class="cp-badge cp-badge--compact cp-status-badge-compact" data-ontint="info"><span class="cp-icon" data-fill-ink aria-hidden="true">downloading</span><span class="cp-tabular" data-fill-ink>42%</span></span>Poster</div>
  <div class="cp-plate"><span class="cp-badge cp-badge--compact cp-status-badge-compact" data-ontint="success"><span class="cp-icon" data-fill-ink aria-hidden="true">check_circle</span></span>Poster</div>
  <div class="cp-plate"><span class="cp-dot cp-status-badge-dot" data-ontint="success"></span>Poster</div>
</div>
<script>
(function () {
  // The compact badge's ink is foregroundOn(walked tone): read the walked colour back off the pill.
  function ink() {
    document.querySelectorAll('[data-fill-ink]').forEach(function (el) {
      var m = getComputedStyle(el.parentNode).color.match(/[\d.]+/g);
      var c = window.Cupola.foregroundOn({ r: +m[0], g: +m[1], b: +m[2] });
      el.style.color = 'rgb(' + Math.round(c.r) + ', ' + Math.round(c.g) + ', ' + Math.round(c.b) + ')';
    });
  }
  if (window.Cupola) { window.Cupola.refresh(); ink(); }
})();
</script>
</body>
</html>
