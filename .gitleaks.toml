# Test fixtures carry synthetic values that look like credentials: `test-key`,
# 8-character placeholder keys, Plex `ratingKey`s and pair fixture keys. They
# are not secrets, and the suite is offline by design.
#
# A config file replaces gitleaks' built-in rules unless it extends them: an
# allowlist on its own scans with no rules at all and always reports clean.
[extend]
useDefault = true

# The allowlist is deliberately limited to `test/`: a real key in `lib/`, in a
# script or in a workflow must still fail the scan.
[allowlist]
description = "Synthetic values in test fixtures"
paths = [
  '''test/.*''',
]
