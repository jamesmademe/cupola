# E2E harness for the download/media clients (plan §7.6). Brings up real service
# instances with pre-seeded, deterministic credentials so the tagged tests under
# test/e2e/ can exercise the actual transport (HTTP, auth, real envelopes).
#
#   docker compose -f docker-compose.e2e.yml up -d --wait
#   flutter test --tags e2e --run-skipped
#   docker compose -f docker-compose.e2e.yml down -v
#
# Notes:
#  - SABnzbd verifies the request hostname, so tests connect via 127.0.0.1 and
#    the seed .ini sets host_whitelist accordingly.
#  - NZBGet credentials are injected via env → deterministic Basic auth.
#  - Unraid has no OS container; it stays schema-only (tiers 2-3). See §7.6.
services:
  sabnzbd:
    # Pinned by manifest-list digest; the tag is kept for readability.
    image: lscr.io/linuxserver/sabnzbd:5.1.3-ls273@sha256:948ea3dc45d68943ec14b33ba37ffa1488da3e9837bf3ca0f75621e971614d85
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # sabnzbd.ini pre-seeded with `api_key=test-key` and a host_whitelist.
      - ./test/e2e/seed/sabnzbd:/config

  nzbget:
    image: lscr.io/linuxserver/nzbget:v26.3-ls263@sha256:24951ff9689ddbc0843e309ed16db74409a077541a8aeaecca606ae3565768f2
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - NZBGET_USER=nzbget
      - NZBGET_PASS=tegbzn6789
    ports:
      - "127.0.0.1:6789:6789"

  readarr:
    # The floating LinuxServer tag was retired; keep the E2E lab on the last
    # published multi-arch develop image so the harness remains reproducible.
    image: ghcr.io/linuxserver/readarr:develop-0.4.18.2805-ls157@sha256:baf471a7101b58f361ef960de91cd15f23bae82d0126df6a9edbeaf5c5aa4392
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      # Keep readiness on the service's authenticated API path: a running
      # process is not enough for the E2E tier, and a bad API key must be
      # reported as unhealthy as well.
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --header
        - "X-Api-Key: test-key"
        - http://127.0.0.1:8787/api/v1/system/status
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      # config.xml pre-seeded with <ApiKey>test-key</ApiKey>.
      - ./test/e2e/seed/readarr:/config
