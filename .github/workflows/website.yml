name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'pubspec.yaml'
      - 'assets/brand/**'
      - 'tool/service_glyphs/svg/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'pubspec.yaml'
      - 'assets/brand/**'
      - 'tool/service_glyphs/svg/**'
      - '.github/workflows/website.yml'

# The site reads the README's services table, the brand mark, the service
# marks and the version from the repository, so a change to any of them is
# checked here before it reaches the deployed site.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build
