name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only reads the repository. The default token is read-only on
# newer repositories, but that is an organisation setting, not a guarantee:
# stating it here makes the least privilege part of the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit behind the `v4` tag. A moving tag on a checkout
      # that runs pull-request code is a supply-chain hole, not a convenience.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify platform icons
        run: bash scripts/verify_icons.sh

  # The suite runs as bundles (`tool/test_bundles`), split across shards
  # that each compile and run their own share: on a 4-core runner the time
  # goes into compiling, and a shard compiles only what it runs.
  test:
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one red shard does not hide another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests (shard ${{ matrix.shard }} of 3)
        run: dart run tool/test_bundles/test_bundles.dart --shard ${{ matrix.shard }}/3

  # The one check the branch rules require, by the name they know: green
  # only when the analysis and every shard are.
  analyze-and-test:
    runs-on: ubuntu-latest
    needs: [analyze, test]
    if: always()
    steps:
      - name: All checks passed
        run: |
          [ "${{ needs.analyze.result }}" = success ] && [ "${{ needs.test.result }}" = success ]

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Full history: a secret removed in a later commit is still in the
      # repository, and the local pre-commit hook is not there for a
      # contributor or a fresh clone.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
